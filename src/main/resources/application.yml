spring:
  application:
    name: ai-code-mother-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_code_mother}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  session:
    store-type: redis
    time-to-live: 2592000
  profiles:
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
  main:
    allow-bean-definition-overriding: true
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.jay.aicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: ${LANGCHAIN4J_OPENAI_API_KEY}
      base-url: ${LANGCHAIN4J_OPENAI_BASE_URL:https://api.deepseek.com}
      model-name: ${LANGCHAIN4J_OPENAI_MODEL_NAME:deepseek-chat}
      max-tokens: ${LANGCHAIN4J_V4_MAX_TOKENS:8192}
      temperature: ${LANGCHAIN4J_V4_TEMPERATURE:0.2}
    chat-model:
      api-key: ${LANGCHAIN4J_OPENAI_API_KEY}
      base-url: ${LANGCHAIN4J_OPENAI_BASE_URL:https://api.deepseek.com}
      model-name: ${LANGCHAIN4J_OPENAI_MODEL_NAME:deepseek-chat}
    reasoning-streaming-chat-model:
      api-key: ${LANGCHAIN4J_REASONING_API_KEY:${LANGCHAIN4J_OPENAI_API_KEY}}
      base-url: ${LANGCHAIN4J_REASONING_BASE_URL:${LANGCHAIN4J_OPENAI_BASE_URL:https://api.deepseek.com}}
      model-name: ${LANGCHAIN4J_REASONING_MODEL_NAME:deepseek-reasoner}
      max-tokens: ${LANGCHAIN4J_REASONING_MAX_TOKENS:8192}
      temperature: ${LANGCHAIN4J_REASONING_TEMPERATURE:0.7}
      log-requests: ${LANGCHAIN4J_LOG_REQUESTS:false}
      log-responses: ${LANGCHAIN4J_LOG_RESPONSES:false}

cos:
  client:
    host: ${cos.client.host}
    secretId: ${cos.client.secretId}
    secretKey: ${cos.client.secretKey}
    bucket: ${cos.client.bucket}
    region: ${cos.client.region}
